<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="r0guekimo">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1b2030" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e2e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff2e2e" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff2e2e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#4b0000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4b0000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <clipPath id="frame"><rect width="900" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="260" fill="#0b0d12"/>
    <rect width="900" height="260" fill="url(#grid)"/>
    <rect width="900" height="260" fill="url(#glow)"/>

    <!-- network of nodes -->
    <g stroke="#7a1414" stroke-width="1" opacity="0.8">
      <line x1="620" y1="60" x2="700" y2="110"/>
      <line x1="700" y1="110" x2="790" y2="70"/>
      <line x1="700" y1="110" x2="760" y2="190"/>
      <line x1="790" y1="70" x2="850" y2="130"/>
      <line x1="760" y1="190" x2="850" y2="130"/>
      <line x1="760" y1="190" x2="660" y2="205"/>
      <line x1="620" y1="60" x2="560" y2="120"/>
      <line x1="560" y1="120" x2="660" y2="205"/>
      <line x1="560" y1="120" x2="700" y2="110"/>
    </g>
    <g fill="#ff2e2e">
      <circle cx="620" cy="60" r="4"><animate attributeName="opacity" values="1;0.25;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="110" r="6"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
      <circle cx="790" cy="70" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="130" r="5"><animate attributeName="opacity" values="1;0.2;1" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="190" r="5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="205" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="120" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
    </g>
    <!-- ping ring on the central node -->
    <circle cx="700" cy="110" r="6" fill="none" stroke="#ff2e2e" stroke-width="1.5">
      <animate attributeName="r" values="6;48" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- scan line -->
    <rect x="0" y="-4" width="900" height="3" fill="url(#scan)" filter="url(#soft)">
      <animate attributeName="y" values="-4;264" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- title with glitch layers -->
    <g font-family="'Courier New', Courier, monospace" font-weight="700" font-size="72">
      <text x="60" y="130" fill="#ff2e2e" opacity="0">r0guekimo
        <animateTransform attributeName="transform" type="translate"
          values="0 0;0 0;5 -2;-4 2;0 0;0 0" keyTimes="0;0.90;0.92;0.94;0.96;1" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.8;0.8;0;0" keyTimes="0;0.90;0.92;0.94;0.96;1" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="130" fill="#00e5ff" opacity="0">r0guekimo
        <animateTransform attributeName="transform" type="translate"
          values="0 0;0 0;-5 2;4 -2;0 0;0 0" keyTimes="0;0.90;0.92;0.94;0.96;1" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.7;0.7;0;0" keyTimes="0;0.90;0.92;0.94;0.96;1" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="130" fill="#ececec">r0guekimo</text>
    </g>

    <!-- cycling tagline -->
    <g font-family="'Courier New', Courier, monospace" font-size="24">
      <text x="62" y="182" fill="#ff2e2e">&gt;</text>
      <text x="88" y="182" fill="#b8bcc8" opacity="1">offensive security
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.30;0.34;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="88" y="182" fill="#b8bcc8" opacity="0">cryptography &amp; web3
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.37;0.63;0.67;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="88" y="182" fill="#b8bcc8" opacity="0">LLM red teaming
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.70;0.96;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <rect x="374" y="162" width="11" height="24" fill="#ff2e2e">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="62" y="232" font-family="'Courier New', Courier, monospace" font-size="13" fill="#4a5163">authorized targets only</text>
  </g>

  <rect x="0.5" y="0.5" width="899" height="259" rx="14" fill="none" stroke="#2a2f3a"/>
</svg>
