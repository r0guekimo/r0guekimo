<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="offensive security, cryptography and web3, LLM red teaming">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2e2e"/>
      <stop offset="1" stop-color="#4b0000"/>
    </linearGradient>
  </defs>

  <style>
    .card { fill: #0b0d12; stroke: #2a2f3a; stroke-width: 1; }
    .march { fill: none; stroke: url(#edge); stroke-width: 1.5; stroke-dasharray: 6 10; animation: march 3s linear infinite; }
    .title { font-family: 'Courier New', Courier, monospace; font-weight: 700; font-size: 20px; fill: #ececec; }
    .sub { font-family: 'Courier New', Courier, monospace; font-size: 13px; fill: #7d8597; }
    .tag { font-family: 'Courier New', Courier, monospace; font-size: 12px; fill: #ff2e2e; }
    .ico { fill: none; stroke: #ff2e2e; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .spin { transform-origin: 70px 78px; animation: spin 9s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes march { to { stroke-dashoffset: -64; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- card 1: offensive security -->
  <g>
    <rect class="card" x="10" y="10" width="280" height="180" rx="12"/>
    <rect class="march" x="10" y="10" width="280" height="180" rx="12"/>
    <g class="spin">
      <circle class="ico" cx="70" cy="78" r="22"/>
      <line class="ico" x1="70" y1="44" x2="70" y2="58"/>
      <line class="ico" x1="70" y1="98" x2="70" y2="112"/>
      <line class="ico" x1="36" y1="78" x2="50" y2="78"/>
      <line class="ico" x1="90" y1="78" x2="104" y2="78"/>
    </g>
    <circle cx="70" cy="78" r="3" fill="#ff2e2e" class="pulse"/>
    <text class="tag" x="130" y="62">01</text>
    <text class="title" x="130" y="86">offensive</text>
    <text class="title" x="130" y="108">security</text>
    <text class="sub" x="30" y="150">recon · web &amp; API · AD</text>
    <text class="sub" x="30" y="170">privesc · bug bounty · CTF</text>
  </g>

  <!-- card 2: cryptography & web3 -->
  <g>
    <rect class="card" x="310" y="10" width="280" height="180" rx="12"/>
    <rect class="march" x="310" y="10" width="280" height="180" rx="12"/>
    <g class="pulse">
      <rect class="ico" x="352" y="70" width="36" height="30" rx="5"/>
      <path class="ico" d="M 359 70 V 60 a 11 11 0 0 1 22 0 V 70"/>
      <circle cx="370" cy="83" r="3" fill="#ff2e2e"/>
    </g>
    <text class="tag" x="430" y="62">02</text>
    <text class="title" x="430" y="86">crypto &amp;</text>
    <text class="title" x="430" y="108">web3</text>
    <text class="sub" x="330" y="150">RSA · ECC · AES · ChaCha20</text>
    <text class="sub" x="330" y="170">EVM · smart contract security</text>
  </g>

  <!-- card 3: LLM red teaming -->
  <g>
    <rect class="card" x="610" y="10" width="280" height="180" rx="12"/>
    <rect class="march" x="610" y="10" width="280" height="180" rx="12"/>
    <path class="ico" d="M 652 56 h 44 a 8 8 0 0 1 8 8 v 26 a 8 8 0 0 1 -8 8 h -26 l -12 10 v -10 h -6 a 8 8 0 0 1 -8 -8 v -26 a 8 8 0 0 1 8 -8 z"/>
    <text class="tag blink" x="662" y="84" style="font-size:20px">_</text>
    <text class="tag" x="730" y="62">03</text>
    <text class="title" x="730" y="86">LLM red</text>
    <text class="title" x="730" y="108">teaming</text>
    <text class="sub" x="630" y="150">prompt injection · jailbreaks</text>
    <text class="sub" x="630" y="170">RAG &amp; agent security</text>
  </g>
</svg>
